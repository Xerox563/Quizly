# How it Works ?
'''
- User sends request to load balancer (port 80)
- Load balancer picks 1 of 4 servers
- That server handles request
- All servers share same database
- Load balancer picks next server for next request
'''


upstream todo_backends {
    server 192.168.1.10:8001;
    192.168.1.11:8002;
    192.168.1.12:8003;
    192.168.1.13:8004;
    192.168.1.14:8005;
}

server {
    listen 80;
    location / {
        # Request comes to port 80 (load balancer)
        # Nginx sends it to one of 4 servers using round-robin
        proxy_pass http://todo_backends;
        proxy_http+version 1.1;
        proxy_set_header Connection "";
    }
}

# Request flow:
# User hits port 80 (load balancer)
# Nginx: "Which server is free?" 
# Nginx: "Server 1 is free, send request there"
# Server 1 handles request, saves to SHARED database
# Response goes back to user
#
# Next request:
# Nginx: "Which server is free?" (round-robin)
# Nginx: "Server 2 is free, send request there"
# And so on...